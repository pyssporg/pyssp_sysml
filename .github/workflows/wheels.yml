name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

# Attaching the artifacts to a release needs a write-scoped token; the default
# GITHUB_TOKEN is read-only, which failed every tagged run before this.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        # The version is dynamic (attr = pyssp_sysml.__version__), so the
        # artifact name is checked instead of being assumed. The editable
        # install is also how the version guard reads the package version, and
        # it fails here if a direct-URL dependency is no longer downloadable.
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
          python -m build --wheel --sdist

      - name: Check artifacts
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.split("-")[1] != "0.0.0", wheel.name
          with zipfile.ZipFile(wheel) as zf:
              assert zf.testzip() is None
              name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              text = zf.read(name).decode()
          requirements = [
              line.split(":", 1)[1].strip()
              for line in text.splitlines()
              if line.startswith("Requires-Dist:")
          ]
          # A direct URL renders as "name @ url"; assert the owner and the tag.
          assert any(
              r.startswith(
                  "pycps_sysml @ https://github.com/pyssporg/pycps_sysml/"
                  "releases/download/v0.4.0/"
              )
              for r in requirements
          ), requirements
          assert any(
              r.startswith(
                  "experimental-pyssp-standard @ https://github.com/pyssporg/"
                  "pyssp_standard_exp/releases/download/v"
              )
              for r in requirements
          ), requirements
          # sysmlpy is owned by pycps_sysml, not required directly here.
          assert not any(r.startswith("sysmlpy") for r in requirements), requirements
          print(wheel.name)
          PY

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python -c 'import pyssp_sysml; print(pyssp_sysml.__version__)')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyssp_sysml.__version__ ${version}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
